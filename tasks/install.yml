---
- name: Ensure Nginx paths exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
    owner: "{{ nginx_uid }}"
    group: "{{ nginx_gid }}"
  with_items:
    - "{{ nginx_base_path }}"
    - "{{ nginx_config_path }}"
    - "{{ nginx_data_path }}"

- name: Ensure Nginx support files installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item }}.j2"
    dest: "{{ nginx_base_path }}/{{ item }}"
    mode: "0640"
    owner: "{{ nginx_uid }}"
    group: "{{ nginx_gid }}"
  with_items:
    - env
    - labels
  register: nginx_support_files_result

- name: Ensure Nginx configuration installed
  ansible.builtin.copy:
    content: "{{ nginx_configuration }}"
    dest: "{{ nginx_config_path }}/nginx.conf"
    mode: "0640"
    owner: "{{ nginx_uid }}"
    group: "{{ nginx_gid }}"
  register: nginx_config_file_result

- name: Ensure Nginx container image is pulled via community.docker.docker_image_pull
  when: devture_systemd_docker_base_container_image_pull_method == 'ansible-module'
  community.docker.docker_image_pull:
    name: "{{ nginx_container_image }}"
    pull: always
  register: nginx_container_image_pull_result_ansible_module
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: nginx_container_image_pull_result_ansible_module is not failed

- name: Ensure Nginx container image is pulled via ansible.builtin.command
  when: devture_systemd_docker_base_container_image_pull_method == 'command'
  ansible.builtin.command:
    cmd: "{{ devture_systemd_docker_base_host_command_docker }} pull {{ nginx_container_image }}"
  register: nginx_container_image_pull_result_command
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: nginx_container_image_pull_result_command is not failed
  changed_when: "'Downloaded newer image' in nginx_container_image_pull_result_command.stdout"

- name: Ensure Nginx container network is created via community.docker.docker_network
  when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
  community.docker.docker_network:
    enable_ipv6: "{{ devture_systemd_docker_base_ipv6_enabled }}"
    name: "{{ nginx_container_network }}"
    driver: bridge
    driver_options: "{{ devture_systemd_docker_base_container_networks_driver_options }}"
  register: nginx_network_creation_result

- name: Ensure Nginx container network is created via ansible.builtin.command
  when: devture_systemd_docker_base_container_network_creation_method == 'command'
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }} network create
      {% if devture_systemd_docker_base_ipv6_enabled %}--ipv6{% endif %}
      {{ devture_systemd_docker_base_container_networks_driver_options_string }}
      {{ nginx_container_network }}
  register: nginx_network_creation_result
  changed_when: nginx_network_creation_result.rc == 0
  failed_when: nginx_network_creation_result.rc != 0 and 'already exists' not in nginx_network_creation_result.stderr

- name: Ensure Nginx systemd service is present
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/nginx.service.j2"
    dest: "{{ devture_systemd_docker_base_systemd_path }}/{{ nginx_identifier }}.service"
    mode: "0644"
  register: nginx_systemd_service_result

- name: Determine whether Nginx needs a restart
  ansible.builtin.set_fact:
    nginx_restart_necessary: >-
      {{
        nginx_support_files_result.changed | default(false)
        or nginx_config_file_result.changed | default(false)
        or nginx_systemd_service_result.changed | default(false)
        or nginx_container_image_pull_result_ansible_module.changed | default(false)
        or nginx_container_image_pull_result_command.changed | default(false)
      }}
