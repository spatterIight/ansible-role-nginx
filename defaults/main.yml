---

# Nginx is a web server, reverse proxy and caching server.
# Project source code URL: https://github.com/nginx/nginx

nginx_enabled: true

nginx_identifier: nginx
nginx_base_path: "/{{ nginx_identifier }}"
nginx_config_path: "{{ nginx_base_path }}/config"
nginx_data_path: "{{ nginx_base_path }}/data"

# renovate: datasource=docker depName=library/nginx versioning=semver
nginx_version: 1.31.6

nginx_uid: ""
nginx_gid: ""

# The hostname at which Nginx is served.
nginx_hostname: ""

# The path at which Nginx is served.
# This value must either be `/` or not end with a slash (e.g. `/nginx`).
nginx_path_prefix: /

nginx_container_image: "{{ nginx_container_image_registry_prefix }}nginx:{{ nginx_container_image_tag }}"
nginx_container_image_tag: "{{ nginx_version }}-alpine"
nginx_container_image_registry_prefix: "{{ nginx_container_image_registry_prefix_upstream }}"
nginx_container_image_registry_prefix_upstream: "{{ nginx_container_image_registry_prefix_upstream_default }}"
nginx_container_image_registry_prefix_upstream_default: docker.io/

# The base container network. It will be auto-created by this role if it doesn't exist already.
nginx_container_network: "{{ nginx_identifier }}"

# Control if the container network is deleted on uninstalling.
nginx_container_network_deletion_enabled: true

# The port number that Nginx listens on inside the container.
#
# The container runs as a non-root user, so this needs to be an unprivileged port (1024 or higher).
nginx_container_http_port: 8080

# Specify how the container publishes its HTTP port (as defined by `nginx_container_http_port`).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:8080"), or empty string to not expose.
nginx_container_http_host_bind_port: ""

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to expose this container to another reverse proxy, which runs in a different container network,
# or to let Nginx reach other containers (e.g. when using it as a reverse-proxy for them).
nginx_container_additional_networks: "{{ nginx_container_additional_networks_auto + nginx_container_additional_networks_custom }}"
# nginx_container_additional_networks_auto is reserved for usage by the playbook.
# Your custom networks should go into nginx_container_additional_networks_custom.
nginx_container_additional_networks_auto: []
nginx_container_additional_networks_custom: []

# A list of additional "volumes" to mount in the container.
# This list gets populated dynamically at runtime. You can provide a different default value,
# if you wish to mount your own files into the container.
# Contains definition objects like this: `{"type": "bind", "src": "/outside", "dst": "/inside", "options": "readonly"}.
# See the `--mount` documentation for the `docker run` command.
nginx_container_additional_volumes: "{{ nginx_container_additional_volumes_auto + nginx_container_additional_volumes_custom }}"
nginx_container_additional_volumes_auto: []
nginx_container_additional_volumes_custom: []

# nginx_container_labels_traefik_enabled controls whether labels to assist a Traefik reverse-proxy will be attached to the container.
# See `../templates/labels.j2` for details.
#
# To inject your own other container labels, see `nginx_container_labels_additional_labels_custom`.
nginx_container_labels_traefik_enabled: true
nginx_container_labels_traefik_docker_network: "{{ nginx_container_network }}"
nginx_container_labels_traefik_hostname: "{{ nginx_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/nginx`).
nginx_container_labels_traefik_path_prefix: "{{ nginx_path_prefix }}"
nginx_container_labels_traefik_rule: "Host(`{{ nginx_container_labels_traefik_hostname }}`){% if nginx_container_labels_traefik_path_prefix != '/' %} && PathPrefix(`{{ nginx_container_labels_traefik_path_prefix }}`){% endif %}"
nginx_container_labels_traefik_priority: 0
nginx_container_labels_traefik_entrypoints: web-secure
nginx_container_labels_traefik_tls: "{{ nginx_container_labels_traefik_entrypoints != 'web' }}"
nginx_container_labels_traefik_tls_certResolver: default  # noqa var-naming

# Controls whether a compression middleware will be injected into the middlewares list.
# This compression middleware is supposed to be defined elsewhere (using labels or a File provider, etc.) and is merely referenced by this router.
nginx_container_labels_traefik_compression_middleware_enabled: false
nginx_container_labels_traefik_compression_middleware_name: ""

# Controls which additional headers to attach to all HTTP requests.
# To add your own custom request headers, use `nginx_container_labels_traefik_additional_request_headers_custom`
nginx_container_labels_traefik_additional_request_headers: "{{ nginx_container_labels_traefik_additional_request_headers_auto | combine(nginx_container_labels_traefik_additional_request_headers_custom) }}"
nginx_container_labels_traefik_additional_request_headers_auto: {}
nginx_container_labels_traefik_additional_request_headers_custom: {}

# Controls which additional headers to attach to all HTTP responses.
# To add your own custom response headers, use `nginx_container_labels_traefik_additional_response_headers_custom`
nginx_container_labels_traefik_additional_response_headers: "{{ nginx_container_labels_traefik_additional_response_headers_auto | combine(nginx_container_labels_traefik_additional_response_headers_custom) }}"
nginx_container_labels_traefik_additional_response_headers_auto: |
  {{
    {}
    | combine ({'X-XSS-Protection': nginx_http_header_xss_protection} if nginx_http_header_xss_protection else {})
    | combine ({'X-Content-Type-Options': nginx_http_header_content_type_options} if nginx_http_header_content_type_options else {})
    | combine ({'Content-Security-Policy': nginx_http_header_content_security_policy} if nginx_http_header_content_security_policy else {})
    | combine ({'Permissions-Policy': nginx_http_header_permissions_policy} if nginx_http_header_permissions_policy else {})
    | combine ({'Strict-Transport-Security': nginx_http_header_strict_transport_security} if nginx_http_header_strict_transport_security and nginx_container_labels_traefik_tls else {})
  }}
nginx_container_labels_traefik_additional_response_headers_custom: {}

# nginx_container_labels_additional_labels contains a multiline string with additional labels to add to the container label file.
# See `../templates/labels.j2` for details.
# To add your own custom labels, use `nginx_container_labels_additional_labels_custom`
#
# Example:
# nginx_container_labels_additional_labels_custom:
#   - my.label=1
#   - another.label="here"
nginx_container_labels_additional_labels: "{{ nginx_container_labels_additional_labels_auto + nginx_container_labels_additional_labels_custom }}"
nginx_container_labels_additional_labels_auto: []
nginx_container_labels_additional_labels_custom: []

# Specify the size of the container's tmpfs volume.
# The container's filesystem is read-only, so Nginx stores its PID file and all of its
# temporary files (request bodies being uploaded, buffered upstream responses, etc.) there.
nginx_container_tmpfs_tmp_size: 128m

# A list of extra arguments to pass to the container (`docker create` command)
nginx_container_extra_arguments: "{{ nginx_container_extra_arguments_auto + nginx_container_extra_arguments_custom }}"
nginx_container_extra_arguments_auto: []
nginx_container_extra_arguments_custom: []

# A list of extra arguments to pass to the process inside the container
#
# The container's entrypoint is overridden to be the `nginx` binary itself,
# so these arguments are passed to `nginx` directly.
#
# `-e stderr` makes Nginx log early startup errors (before `nginx.conf` is parsed) to stderr,
# instead of trying to open `/var/log/nginx/error.log` on the read-only container filesystem.
nginx_process_extra_arguments: "{{ nginx_process_extra_arguments_auto + nginx_process_extra_arguments_custom }}"
nginx_process_extra_arguments_auto:
  - -e stderr
  - -c /config/nginx.conf
nginx_process_extra_arguments_custom: []

# Specifies the value of the `X-XSS-Protection` header
# Stops pages from loading when they detect reflected cross-site scripting (XSS) attacks.
#
# Learn more about it is here:
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-XSS-Protection
# - https://portswigger.net/web-security/cross-site-scripting/reflected
nginx_http_header_xss_protection: "1; mode=block"

# Specifies the value of the `X-Content-Type-Options` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options
nginx_http_header_content_type_options: nosniff

# Specifies the value of the `Content-Security-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy
nginx_http_header_content_security_policy: frame-ancestors 'self'

# Specifies the value of the `Permissions-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Permissions-Policy
nginx_http_header_permissions_policy: "{{ 'interest-cohort=()' if nginx_floc_optout_enabled else '' }}"

# Specifies the value of the `Strict-Transport-Security` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
nginx_http_header_strict_transport_security: "max-age=31536000; includeSubDomains{{ '; preload' if nginx_hsts_preload_enabled else '' }}"

# Controls whether to send a "Permissions-Policy interest-cohort=();" header along with all responses
#
# Learn more about what it is here:
# - https://www.eff.org/deeplinks/2021/03/googles-floc-terrible-idea
# - https://paramdeo.com/blog/opting-your-website-out-of-googles-floc-network
# - https://amifloced.org/
#
# Of course, a better solution is to just stop using browsers (like Chrome), which participate in such tracking practices.
# See: `nginx_http_header_permissions_policy`
nginx_floc_optout_enabled: true

# Controls if HSTS preloading is enabled
#
# In its strongest and recommended form, the [HSTS policy](https://www.chromium.org/hsts) includes all subdomains, and
# indicates a willingness to be "preloaded" into browsers:
# `Strict-Transport-Security: max-age=31536000; includeSubDomains; preload`
# For more information visit:
# - https://en.wikipedia.org/wiki/HTTP_Strict_Transport_Security
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
# - https://hstspreload.org/#opt-in
# See: `nginx_http_header_strict_transport_security`
nginx_hsts_preload_enabled: false

# List of systemd services that the Nginx systemd service depends on
nginx_systemd_required_services_list: "{{ nginx_systemd_required_services_list_default + nginx_systemd_required_services_list_auto + nginx_systemd_required_services_list_custom }}"
nginx_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
nginx_systemd_required_services_list_auto: []
nginx_systemd_required_services_list_custom: []

# List of systemd services that the Nginx systemd service wants
nginx_systemd_wanted_services_list: "{{ nginx_systemd_wanted_services_list_default + nginx_systemd_wanted_services_list_auto + nginx_systemd_wanted_services_list_custom }}"
nginx_systemd_wanted_services_list_default: []
nginx_systemd_wanted_services_list_auto: []
nginx_systemd_wanted_services_list_custom: []

# Controls how long to wait for the container to stop gracefully before killing it.
nginx_container_stop_grace_time_seconds: "{{ devture_systemd_docker_base_container_stop_grace_time_seconds }}"

# Controls how long the pre-start cleanup should wait for stale container-name release
# before failing startup explicitly.
nginx_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

# Controls the delay between pre-start cleanup retries.
nginx_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

# Shell command used in the systemd pre-start phase to deterministically remove a stale
# container and wait until Docker releases its name.
nginx_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ nginx_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ nginx_container_stop_grace_time_seconds }} {{ nginx_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ nginx_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ nginx_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ nginx_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ nginx_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ nginx_identifier }} after {{ nginx_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

########################################################################
#                                                                      #
# configuration                                                        #
#                                                                      #
########################################################################

# nginx_config_log_level controls the `error_log` level.
# Valid values: debug, info, notice, warn, error, crit, alert, emerg
nginx_config_log_level: warn

# nginx_config_access_log_enabled controls whether logs for incoming requests are collected
nginx_config_access_log_enabled: true

# nginx_config_worker_processes controls the `worker_processes` directive.
nginx_config_worker_processes: auto

# nginx_config_worker_connections controls the `worker_connections` directive.
nginx_config_worker_connections: 1024

# nginx_config_client_max_body_size controls the `client_max_body_size` directive,
# which limits the size of request bodies (e.g. uploads).
nginx_config_client_max_body_size: 10m

# nginx_config_resolver controls the `resolver` directive, used for resolving hostnames at runtime.
# This is useful when proxying to a variable (e.g. `set $backend http://service:8080; proxy_pass $backend;`),
# so that Nginx can start even if the upstream container is not running.
#
# The default points to Docker's embedded DNS server, which is available for containers
# connected to a user-defined network (see `nginx_container_network`).
nginx_config_resolver: "127.0.0.11 valid=10s ipv6=off"

# nginx_server_configuration contains the Nginx configuration (directives in the `server` context)
# of the default server, which listens on `nginx_container_http_port`.
#
# By default, it serves static files from `nginx_data_path`.
#
# Example (reverse-proxying to another container):
# nginx_server_configuration: |
#   location / {
#     set $backend http://my-service:8080;
#     proxy_pass $backend;
#   }
nginx_server_configuration: |
  location {{ nginx_path_prefix if nginx_path_prefix == '/' else (nginx_path_prefix + '/') }} {
    alias /data/;
    index index.html;
    try_files $uri $uri/ =404;
  }

# Default Nginx configuration template which covers the generic use case.
# You can customize it by controlling the various variables inside it.
#
# For a more advanced customization, you can extend the default (see `nginx_configuration_extension`)
# or completely replace this variable with your own template.
nginx_configuration: "{{ lookup('template', 'templates/nginx.conf.j2') }}"

# nginx_configuration_extension contains additional Nginx configuration (directives in the `http` context),
# which extends the default configuration (`nginx_configuration`).
#
# You can use it to define additional `server` blocks, `upstream` blocks, `map` blocks, etc.
#
# Example:
# nginx_configuration_extension: |
#   server {
#     listen 8080;
#     server_name another.example.com;
#     return 200 "Hello";
#   }
nginx_configuration_extension: ""

########################################################################
#                                                                      #
# /configuration                                                       #
#                                                                      #
########################################################################

# Specify the timezone
nginx_environment_variables_tz: UTC

# nginx_environment_variables_additional_variables contains a multiline string with additional environment variables to pass to the container.
#
# Example:
# nginx_environment_variables_additional_variables: |
#   VAR=1
#   ANOTHER=value
nginx_environment_variables_additional_variables: ""

# nginx_restart_necessary controls whether the Nginx systemd
# service will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
nginx_restart_necessary: false
