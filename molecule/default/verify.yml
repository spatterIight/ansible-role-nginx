---
- name: Verify Nginx systemd service
  hosts: all
  become: true
  gather_facts: false

  vars:
    nginx_verify_units:
      - nginx.service

  tasks:
    - name: Verify that Nginx works
      block:
        - name: Wait for the Nginx systemd services to become active (up to 180s each)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
          register: nginx_services
          until: nginx_services.status.ActiveState == 'active'
          retries: 36
          delay: 5
          loop: "{{ nginx_verify_units }}"
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `Restart=always` in the systemd unit means that even a container which crashes
        # and gets restarted reads as active here, so this is a precondition rather than
        # a result.
        - name: Assert the Nginx systemd services are active
          ansible.builtin.assert:
            that: nginx_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
            fail_msg: >-
              Not every service is active:
              {{ dict(nginx_verify_units | zip(nginx_services.results | map(attribute='status.ActiveState'))) }}
            success_msg: "Every systemd service is active"

        - name: Retrieve the Nginx systemd services log for debugging
          when: nginx_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          changed_when: false
          loop: "{{ nginx_verify_units }}"

        - name: Ensure the Nginx configuration is valid
          ansible.builtin.command:
            cmd: docker exec nginx nginx -e stderr -c /config/nginx.conf -t
          register: nginx_config_test
          changed_when: false

        - name: Ensure a test page exists in the Nginx data path
          ansible.builtin.copy:
            content: "Hello from Nginx Molecule tests\n"
            dest: /nginx/data/index.html
            mode: "0644"

        - name: Wait for Nginx HTTP endpoint to serve the test page (up to 1m)
          ansible.builtin.uri:
            url: "http://localhost:8080/"
            method: GET
            return_content: true
          register: nginx_endpoint
          until: nginx_endpoint.status == 200
          retries: 12
          delay: 5

        - name: Assert Nginx HTTP endpoint serves the test page
          ansible.builtin.assert:
            that:
              - nginx_endpoint.status == 200
              - "'Hello from Nginx Molecule tests' in nginx_endpoint.content"
            fail_msg: "Nginx did not serve the test page as expected ({{ nginx_endpoint.status | default('no response') }})"
            success_msg: "Nginx served the test page"

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "nginx_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: nginx_restarts_before
              loop: "{{ nginx_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: nginx_restarts_after
              loop: "{{ nginx_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - nginx_restarts_after.results | map(attribute='status.NRestarts') | list == nginx_restarts_before.results | map(attribute='status.NRestarts') | list
                  - nginx_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in nginx_verify_units | zip(nginx_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in nginx_verify_units | zip(nginx_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in nginx_verify_units | zip(nginx_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the Nginx verification summary
          ansible.builtin.debug:
            msg:
              - "Nginx systemd: {% for unit, state in nginx_verify_units | zip(nginx_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Nginx restarts: {% for unit, restarts in nginx_verify_units | zip(nginx_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Nginx configuration test: {{ nginx_config_test.rc }}"
              - "Nginx HTTP: {{ nginx_endpoint.status }}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the Nginx systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=nginx.service
          register: nginx_service_log
          changed_when: false

        - name: Show the Nginx systemd service log
          ansible.builtin.debug:
            var: nginx_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Nginx verification failed. The systemd service log is printed above."
